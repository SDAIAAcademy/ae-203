[project]
name = "llm-applications-labs"
version = "1.0.0"
description = "Lab notebooks for the SDAIA Academy course Building Applications on Language Models"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "numpy>=2.0",
    "pandas>=2.2",
    "rank-bm25>=0.2.2",
    "tokenizers>=0.21",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pytest>=8.3",
    "jupyterlab>=4.4",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
